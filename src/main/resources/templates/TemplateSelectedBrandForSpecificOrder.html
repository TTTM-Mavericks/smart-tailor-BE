<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Order Detail Information</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { width: 100%; padding: 20px; }
        .content { background-color: #ffffff; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        .header { font-size: 24px; font-weight: bold; color: #333333; }
        .message { font-size: 16px; color: #555555; }
        .button { display: inline-block; padding: 10px 20px; font-size: 16px; color: #ffffff; background-color: #4CAF50; text-align: center; text-decoration: none; border-radius: 5px; margin-top: 20px; }
        .design-detail { margin-top: 20px; }
        .design-detail-title { font-size: 18px; font-weight: bold; color: #333333; margin-bottom: 10px; }
        .design-detail-item { margin-bottom: 10px; }
    </style>
</head>
<body>
<div class='container'>
    <div class='content'>
        <div class='header'>Order Detail Information</div>
        <div class='message'>Hi <span th:text="${email}"></span>,</div>
        <div class='message'>We received a request from customer design. We send mail to you order information.</div>
        <div class='message'><span th:text="${orderID}"></span></div>
        <div class='design-detail'>
            <div class='design-detail-title'>Design Details:</div>
            <div th:each="detail : ${detailList}">
                <div class='design-detail-item'>Design Detail ID: <span th:text="${detail.designDetailId}"></span></div>
                <div class='design-detail-item'>Size: <span th:text="${detail.size.sizeName}"></span></div>
                <div class='design-detail-item'>Quantity: <span th:text="${detail.quantity}"></span></div>
            </div>
        </div>
        <a th:href="@{${sendMailSelectedBrandsForOrderLink}}" class='button'>Change Password</a>
    </div>
</div>
</body>
</html>
